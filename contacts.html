<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <nav class="site-nav">
        <a href="index.html">Главная</a>
        <a href="about.html">Обо мне</a>
        <a class="active" href="contacts.html">Контакты</a>
        <button id="theme" class="btn btn-sm btn-outline-info" type="button">Светлая тема</button>
    </nav>

    <main class="container py-5">
        <section class="content-panel">
            <p class="eyebrow">Будем на связи</p>
            <h1>Контакты</h1>
            <p>Telegram: <a href="https://t.me/eva_web" target="_blank" rel="noopener">@eva_web</a></p>

            <h2 class="section-title mt-5">Форма обратной связи</h2>
            <p class="muted-text">Заполни все поля. Сайт проверит данные и покажет сообщение.</p>

            <form id="contactForm" class="contact-form">
                <label for="name" class="form-label">Имя</label>
                <input type="text" id="name" class="form-control mb-3" placeholder="Как тебя зовут?" required>

                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control mb-3" placeholder="name@example.com" required>

                <label for="comment" class="form-label">Сообщение</label>
                <textarea id="comment" class="form-control mb-3" rows="4" placeholder="Напиши сообщение..." required></textarea>

                <button type="submit" class="btn btn-accent">Отправить</button>
                <p id="formMessage" class="mt-3" aria-live="polite"></p>
            </form>
            <p class="small muted-text mt-3">Учебный пример: форма проверяет поля, но пока не отправляет сообщение на почту или сервер.</p>
        </section>
    </main>

    <footer class="site-footer">Мой сайт · 2026</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
